<title>Milwaukee OPM NPD Dictionary</title>
<style>
:root{
 --bg:#f5f6f7;--paper:#fff;--soft:#fafbfc;--text:#17191c;--text2:#444b52;--muted:#747c84;

:focus-visible{outline:3px solid rgba(49,95,139,.25)!important;outline-offset:2px}

.key{position:absolute;right:10px;top:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:#fbfbfc;color:var(--muted);font-size:10px;padding:3px 7px}
.hact{display:flex;justify-content:flex-end;gap:7px}.btn,.ib{border:1px solid var(--line);background:white;color:var(--text2);border-radius:9px;min-height:36px}
.btn{padding:7px 10px}.btn:hover,.ib:hover{border-color:#b4bcc2;background:#fbfbfc}.btn.primary{background:var(--red);border-color:var(--red);color:white;font-weight:650}.btn.primary:hover{background:var(--redd)}

.frow{width:100%;border:0;background:transparent;border-radius:7px;padding:7px 8px;color:var(--text2);display:flex;justify-content:space-between;align-items:center;text-align:left}.frow:hover{background:#eceff1}.frow.active{background:var(--redsoft);color:var(--red);font-weight:620}

.res:hover{background:#fafbfc}.res.active{background:#fff9fa}.res.active:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}

.tag{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px 6px;color:var(--muted);font-size:9px;line-height:1;white-space:nowrap}.tag.sup{background:var(--redsoft);border-color:#e3b2bc;color:var(--red)}.tag.web{background:var(--greensoft);border-color:#bee0c8;color:var(--green)}.tag.warn{background:var(--ambersoft);border-color:#dfc97f;color:var(--amber)}.tag.ai{background:var(--bluesoft);border-color:#c5d7e7;color:var(--blue)}.tag.merge{background:#f4f5f6;border-color:#d8dde1;color:#626a71}
.prov{margin-top:8px}
.prov summary{cursor:pointer;color:var(--text2);font-size:11px;font-weight:650}
.provbody{padding-top:10px}
.variantline{padding:5px 0;color:var(--muted);font-size:10.5px;border-bottom:1px dashed var(--line)}
.variantline:last-child{border-bottom:0}








.rsub{font-size:11.5px;color:var(--text2);margin-top:5px}.rmeta{font-size:10.5px;color:var(--muted);margin-top:4px}.codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.code{background:#f1f3f4;border-radius:5px;padding:3px 5px;color:#3a4248;font-size:10px;font-variant-numeric:tabular-nums}.code i{font-style:normal;color:#899198;font-size:8px;text-transform:uppercase;margin-right:3px}
mark{background:#fff0b9;color:inherit;border-radius:2px;padding:0 .08em}.empty{padding:50px 24px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text2);font-size:14px;margin-bottom:5px}.foot{padding:9px 12px 12px;text-align:center;color:var(--muted);font-size:9.5px}
.detailpane{min-width:0;max-height:calc(100vh - 112px);overflow:auto;scrollbar-width:thin}.detail{max-width:950px;margin:auto;padding:28px 34px 42px}
.kicker{color:var(--red);font-size:10px;font-weight:760;text-transform:uppercase;letter-spacing:.095em;margin-bottom:6px}.dhead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding-bottom:20px;border-bottom:1px solid var(--line)}
.title{font-size:36px;line-height:1.03;letter-spacing:-.032em;margin:0;font-weight:800}.subtitle{margin-top:9px;color:var(--text2);font-size:15px}.trans{margin-top:4px;color:var(--muted);font-size:12px}.dact{display:flex;gap:6px;flex:0 0 auto}
.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:13px}.mchip{background:#f1f3f4;color:#555d64;border-radius:999px;padding:5px 7px;font-size:9.8px}.mchip.good{background:var(--greensoft);color:var(--green)}.mchip.warn{background:var(--ambersoft);color:var(--amber)}.mchip.source{background:var(--redsoft);color:var(--red)}.mchip.ai{background:var(--bluesoft);color:var(--blue)}
.lensbar{padding-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.lenslabel{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.lenstabs{display:inline-flex;gap:2px;padding:3px;background:#f2f4f5;border:1px solid var(--line);border-radius:9px}.lens{border:0;background:transparent;border-radius:6px;padding:5px 8px;color:var(--text2);font-size:10.5px}.lens.active{background:white;color:var(--text);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.lensnote{margin-top:10px;padding:10px 12px;border-left:3px solid var(--red);background:#fffafb;color:var(--text2);font-size:11.5px;line-height:1.55}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0 3px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.qi{padding:11px 12px;background:#fbfbfc;border-right:1px solid var(--line)}.qi:last-child{border-right:0}.qi b{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}.qi span{font-size:11.5px;color:var(--text2);font-weight:620}.goodtxt{color:var(--green)!important}.warntxt{color:var(--amber)!important}
.sec{padding:19px 0;border-bottom:1px solid var(--line)}.sec:last-child{border-bottom:0}.sectitle{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:9px}.sectitle h2{margin:0;color:var(--muted);font-size:10px;font-weight:760;text-transform:uppercase;letter-spacing:.09em}.sectitle span{color:var(--muted);font-size:9.5px}.body{margin:0;color:var(--text2);font-size:13px;line-height:1.67}.opm{padding-left:13px;border-left:3px solid var(--red)}
.callout{margin-top:10px;padding:10px 12px;border-left:3px solid #c7a648;background:var(--ambersoft);color:#644e13;font-size:11.5px;line-height:1.55}
.info{display:grid;grid-template-columns:180px 1fr;border-top:1px solid var(--line)}.il,.iv{padding:8px 0;border-bottom:1px solid var(--line)}.il{font-size:10.5px;color:var(--muted)}.iv{font-size:11.5px;color:var(--text2);font-weight:520}
.entities{display:flex;flex-direction:column;gap:10px}.entity{border:1px solid var(--line);border-radius:10px;overflow:hidden}.ehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:11px 12px;background:#f7f8f9;border-bottom:1px solid var(--line)}.eroute{font-size:11px;font-weight:720}.eroute small{display:block;font-weight:400;color:var(--muted);margin-top:2px}.ecode{border:1px solid #d7dce0;background:white;border-radius:7px;padding:5px 7px;font-size:11px;font-weight:730}.ecode:hover{color:var(--red);border-color:#c98a97;background:var(--redsoft)}
.egrid{display:grid;grid-template-columns:165px minmax(0,1fr)}.ek,.ev{padding:7px 11px;border-bottom:1px solid #eef0f2}.ek{font-size:10px;color:var(--muted)}.ev{font-size:11.3px;color:var(--text2);word-break:break-word}.evidence{display:flex;gap:5px;flex-wrap:wrap}.srcbtn{display:inline-block;border:1px solid var(--line);border-radius:6px;background:white;color:var(--blue);text-decoration:none;padding:4px 6px;font-size:9.5px}.srcbtn:hover{border-color:#a9c3d8}
.review4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.reviewcell{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fbfbfc}
.reviewcell b{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.reviewcell span{display:block;color:var(--text2);font-size:10.5px;line-height:1.45}
@media(max-width:900px){.review4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.review4{grid-template-columns:1fr}}
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cblock{border-left:2px solid var(--line);padding-left:11px}.cblock h3{margin:0 0 6px;font-size:10.5px}.mail{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--blue);font-size:11px;text-decoration:none;padding:2px 0}.mail:hover{text-decoration:underline}
.raw summary,.coll summary{cursor:pointer;color:var(--text2);font-size:11px;font-weight:620}.rawbody{padding-top:8px;color:var(--muted);font-size:10.5px;white-space:pre-wrap;line-height:1.5}
.srcrow{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}.srcrow:last-child{border-bottom:0}.srcrow b{font-size:11px}.srcrow span{font-size:10.5px;color:var(--muted)}








.process-flow{display:flex;flex-direction:column;gap:0;margin-top:4px}
.pstep{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:flex-start;position:relative;padding:6px 0 12px}
.pstep:not(:last-child):after{content:"";position:absolute;left:14px;top:31px;bottom:-1px;width:1px;background:var(--line2)}
.pnum{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:var(--redsoft);color:var(--red);font-size:10px;font-weight:760;z-index:1}
.ptext{padding-top:4px;color:var(--text2);font-size:12px;line-height:1.55}
.rulelist{display:flex;flex-direction:column;gap:7px}

.rule:before{content:"";width:5px;height:5px;border-radius:50%;background:#aeb5bb;margin-top:7px}
.rule.open:before{background:#c5a13e}
.rule.example:before{background:var(--red)}








.rolebar{display:flex;gap:7px;flex-wrap:wrap}
.rolechip{position:relative;border:1px solid var(--line);background:white;border-radius:999px;padding:7px 10px;color:var(--text2);font-size:10.5px;line-height:1;cursor:pointer}
.rolechip:hover{border-color:#c98a97;color:var(--red);background:var(--redsoft)}
.rolechip[data-pic]:hover:after{content:attr(data-pic);position:absolute;left:0;top:calc(100% + 7px);z-index:15;min-width:220px;max-width:340px;padding:8px 9px;border-radius:7px;background:#17191c;color:white;font-size:10px;line-height:1.4;white-space:normal;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.rolehint{font-size:9.5px;color:var(--muted);margin-top:7px}
.process-meta{display:grid;grid-template-columns:160px 1fr;border-top:1px solid var(--line)}
.process-meta .il,.process-meta .iv{padding:8px 0;border-bottom:1px solid var(--line)}
.tag.proc{background:var(--bluesoft);border-color:#c5d7e7;color:var(--blue)}
.related{display:flex;gap:6px;flex-wrap:wrap}.related button,.variant{border:1px solid var(--line);background:white;color:var(--text2)}.related button{border-radius:999px;padding:6px 8px;font-size:10.5px}.related button:hover,.variant:hover{border-color:#c98a97;color:var(--red)}.variant{width:100%;text-align:left;border-radius:8px;padding:8px 9px;margin-top:6px}.variant small{display:block;color:var(--muted);margin-top:2px}
.drawer,.backdrop{display:none}.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#17191c;color:white;border-radius:8px;padding:10px 12px;font-size:11px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}
@media(max-width:1200px){:root{--side:210px;--list:360px}.hin{grid-template-columns:210px minmax(320px,1fr) auto}.brand small{display:none}.detail{padding:24px 26px 38px}}
@media(max-width:960px){:root{--side:0px;--list:340px}.hin{grid-template-columns:auto minmax(260px,1fr) auto;padding:0 14px}.brand b{display:none}.grid{grid-template-columns:1fr}.side{display:none}.mobilefilter{display:inline-block}.work{grid-template-columns:340px minmax(0,1fr)}}
@media(max-width:760px){header{height:auto}.hin{min-height:62px;padding:9px 10px;gap:8px}.key{display:none}.savedlabel{display:none}#q{padding-right:12px}.shell{padding:8px 0 18px}.top{padding:0 10px;margin-bottom:8px}.topnote{display:none}.tabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.tab{padding:7px 5px}.work{display:block;border-left:0;border-right:0;border-radius:0;min-height:auto}.listpane{max-height:none;border-right:0}.detailpane{max-height:none;border-top:8px solid var(--bg)}.detail{padding:22px 17px 34px}.dhead{flex-direction:column}.title{font-size:31px}.dact{width:100%}.dact .btn{flex:1}.quick{grid-template-columns:repeat(2,1fr)}.qi:nth-child(2){border-right:0}.qi:nth-child(-n+2){border-bottom:1px solid var(--line)}.egrid{grid-template-columns:120px 1fr}.contacts{grid-template-columns:1fr}.info{grid-template-columns:125px 1fr}.drawer{display:block;position:fixed;z-index:90;top:0;left:0;bottom:0;width:min(86vw,320px);background:white;transform:translateX(-102%);transition:.2s;padding:18px 16px 26px;overflow:auto;box-shadow:16px 0 34px rgba(0,0,0,.12)}.drawer.show{transform:translateX(0)}.backdrop{position:fixed;inset:0;z-index:80;background:rgba(15,18,20,.3)}.backdrop.show{display:block}.drawerhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}




/* V15 supplier directory */
.rtop{align-items:flex-start}.tags{flex:0 0 auto;flex-wrap:nowrap;align-items:flex-start}
.tag{width:auto!important;min-width:max-content;max-width:none;min-height:0!important;height:auto!important;flex:0 0 auto;align-items:center;justify-content:center;padding:4px 8px;line-height:1.1;white-space:nowrap}

<header><div class="hin">
 <div class="brand"><div class="mark"></div><div><b>OPM NPD DICTIONARY</b><small>V15 • Knowledge + Playbooks + Supplier Directory</small></div></div>
 <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg><input id="q" type="search" placeholder="Search term, process, role/PIC, vendor code, tax ID, supplier…"><span class="key">/</span></div>
 <div class="hact"><button id="filterBtn" class="btn mobilefilter">Filters</button><button id="savedBtn" class="btn">☆ <span class="savedlabel">Saved</span></button></div>
</div></header>
<div class="shell">
 <div class="top"><div class="tabs"><button class="tab active" data-scope="All">All</button><button class="tab" data-scope="Glossary">Dictionary</button><button class="tab" data-scope="Process">Processes</button><button class="tab" data-scope="Supplier">Suppliers</button></div><div id="topnote" class="topnote">One search across terminology and supplier intelligence.</div></div>
 <div class="grid"><aside id="side" class="side"></aside><section class="work">
  <div class="listpane"><div class="toolbar"><div class="count"><b id="count">Loading…</b><span id="mode">Search-ready</span></div><div class="ta">

function parseCSV(text){text=String(text||'').replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c;continue}if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);f='';if(row.some(v=>String(v).trim()))rows.push(row);row=[]}else if(c!=='\r')f+=c}row.push(f);if(row.some(v=>String(v).trim()))rows.push(row);return rows}

 const urls=split(x.externalSources).filter(u=>/^https?:\/\//i.test(u)).slice(0,5);
 urls.forEach((u,i)=>{const d=u.toLowerCase(),registry=/masothue|thuvienphapluat|dulieuphapluat|fiingate|companieshouse|cnverify|volza|enfsolar|enf\.com|disclosures\.ifc|idpvn|infocom|thongtincongty/.test(d);parts.push(`<a class="srcbtn" href="${esc(u)}" target="_blank" rel="noopener">${registry?'Company info':i===0?'Website':'Source '+(i+1)}</a>`)});
 return parts.length?parts.join(' '):'<span class="noinfo">No public website or registration link verified.</span>'
}
function renderSupplier(x){
 const suggested=/suggested commodity/i.test(x.researchStatus||'');const notes=uniq([x.remarks,x.dq].filter(v=>v&&!/^Group Commodity:/i.test(v)));
 $('detail').innerHTML=`<div class="kicker">Supplier working profile</div><div class="dhead"><div><h1 class="title">${esc(x.term)}</h1><div class="subtitle">${esc(x.commodity||'Commodity not confirmed')}</div>${suggested?'<div class="researchnote">Commodity is a public-research suggestion because the TTI Vendor List source was N/A. Confirm with Purchasing/OPM before treating it as controlled TTI sourcing scope.</div>':''}</div><div class="dact"><button id="save" class="btn">${state.saved.has(x.id)?'★ Saved':'☆ Save'}</button><button id="copy" class="btn">Copy</button><button id="share" class="btn primary">Share</button></div></div>
 <div class="supplier-card">
 <div class="supplier-row"><div class="supplier-key">Vendor code</div><div class="supplier-val">${supplierCodeRows(x)}</div></div>
 <div class="supplier-row"><div class="supplier-key">Country / site</div><div class="supplier-val">${esc(primarySite(x))}</div></div>
 <div class="supplier-row"><div class="supplier-key">Commodity & possible parts</div><div class="supplier-val"><b>${esc(x.commodity||'Not confirmed')}</b>${x.verifiedProducts?`<div class="part_examples"><b>Public capability examples</b><br>${esc(x.verifiedProducts)}</div>`:''}</div></div>
 <div class="supplier-row"><div class="supplier-key">Company address</div><div class="supplier-val">${companyAddressHTML(x)}</div></div>
 <div class="supplier-row"><div class="supplier-key">Website / MST / Company info</div><div class="supplier-val">${companyInfoHTML(x)}</div></div>
 <div class="supplier-row"><div class="supplier-key">Supplier working contacts</div><div class="supplier-val">${supplierContactRows(x)}</div></div>
 <div class="supplier-row"><div class="supplier-key">Internal TTI working relation</div><div class="supplier-val">${internalRows(x)}</div></div>
 <div class="supplier-row"><div class="supplier-key">Notes / watch-outs</div><div class="supplier-val">${notes.length?notes.map(v=>`<div class="relationline">${esc(v)}</div>`).join(''):'<span class="noinfo">No working note added yet.</span>'}</div></div>
 </div>`;bindActions(x);updateUrl(x)
}
function listSection(title,items,kind='rule',subtitle=''){
 if(!items||!items.length)return '';
 return `<section class="sec"><div class="sectitle"><h2>${esc(title)}</h2>${subtitle?`<span>${esc(subtitle)}</span>`:''}</div><div class="rulelist">${items.map(v=>`<div class="rule ${kind}"><div>${esc(v)}</div></div>`).join('')}</div></section>`
}
function renderProcess(x){
 const steps=x.processSteps||[],rules=x.workingRules||[],examples=x.processExample||[],opens=x.openChecks||[];
 $('detail').innerHTML=`<div class="kicker">OPM working playbook</div><div class="dhead"><div><h1 class="title">${esc(x.term)}</h1><div class="subtitle">${esc(x.full)}</div><div class="trans">${esc(x.vi)}</div><div class="meta"><span class="mchip">${esc(x.category)}</span><span class="mchip">${esc(x.level)}</span><span class="mchip ai">Working process</span>${opens.length?`<span class="mchip warn">${opens.length} open check${opens.length>1?'s':''}</span>`:''}</div></div><div class="dact"><button id="save" class="btn">${state.saved.has(x.id)?'★ Saved':'☆ Save'}</button><button id="copy" class="btn">Copy</button><button id="share" class="btn primary">Share</button></div></div>
 <section class="sec"><div class="sectitle"><h2>Purpose</h2></div><p class="body">${esc(x.purpose)}</p></section>
 <section class="sec opm"><div class="sectitle"><h2>OPM control point</h2></div><p class="body">${esc(x.opm||'—')}</p></section>
 ${Object.keys(x.rolePics||{}).length?`<section class="sec"><div class="sectitle"><h2>Roles & current PICs</h2><span>role-based ownership</span></div><div class="rolebar">${Object.entries(x.rolePics).map(([role,pic])=>`<button class="rolechip" data-role="${esc(role)}" data-pic="${esc(pic)}" title="${esc(role)} — ${esc(pic)}">${esc(role)}</button>`).join('')}</div><div class="rolehint">Hover to see current contact. On mobile, tap a role. Names are current contacts, not permanent process owners.</div></section>`:''}
 ${steps.length?`<section class="sec"><div class="sectitle"><h2>Standardized flow</h2><span>${steps.length} steps</span></div><div class="process-flow">${steps.map((v,i)=>`<div class="pstep"><div class="pnum">${i+1}</div><div class="ptext">${esc(v.replace(/^\d+\.\s*/,''))}</div></div>`).join('')}</div></section>`:''}
 ${listSection('Working rules',rules,'rule')}
 ${listSection('Examples / calculation',examples,'example')}
 ${listSection('Open checks — confirm before automation or release',opens,'open')}
 <section class="sec"><div class="sectitle"><h2>Applicability & ownership</h2></div><div class="process-meta"><div class="il">Applicability</div><div class="iv">${esc(x.applicability||'—')}</div><div class="il">Typical owner(s)</div><div class="iv">${esc(x.owner||'—')}</div></div><details class="prov"><summary>Source & governance</summary><div class="provbody"><div class="srcrow"><b>${esc(x.sources.join(' | '))}</b><span>${esc(x.refs.join(' | '))}</span></div><div class="callout">${esc(x.provenance)}</div></div></details></section>
 <section class="sec"><div class="sectitle"><h2>Related terms</h2></div><div class="related">${x.related.length?x.related.map(v=>`<button data-rel="${encodeURIComponent(v)}">${esc(v)}</button>`).join(''):'<span class="body">No related terms added.</span>'}</div></section>`;
 bindActions(x);
 $('detail').querySelectorAll('.rolechip').forEach(b=>b.onclick=()=>toast(`${b.dataset.role} — ${b.dataset.pic}`));
 $('detail').querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>{state.q=decodeURIComponent(b.dataset.rel);$('q').value=state.q;selected=0;render()});
 updateUrl(x)
}
function variants(x){return DATA.filter(y=>y.type==='Glossary'&&norm(y.term)===norm(x.term)&&y.id!==x.id)}
function renderGlossary(x){
 const vs=variants(x),ai=x.provenance.includes('AI-assisted');
 $('detail').innerHTML=`<div class="kicker">Bilingual OPM dictionary</div><div class="dhead"><div><h1 class="title">${esc(x.term)}</h1><div class="subtitle">${esc(x.full)}</div><div class="trans">${esc(x.vi)}</div><div class="meta"><span class="mchip">${esc(x.category)}</span><span class="mchip">${esc(x.level)}</span>${x.mergedCount>1?`<span class="mchip">${x.mergedCount} source records consolidated</span>`:''}${ai?'<span class="mchip ai">AI-assisted working explanation</span>':''}</div>${x.ambiguous?'<div class="callout"><b>Context matters:</b> this term has multiple records/meanings. Confirm project/BU/source context before assuming an expansion.</div>':''}</div><div class="dact"><button id="save" class="btn">${state.saved.has(x.id)?'★ Saved':'☆ Save'}</button><button id="copy" class="btn">Copy</button><button id="share" class="btn primary">Share</button></div></div>
 <section class="sec"><div class="sectitle"><h2>Định nghĩa tiếng Việt</h2></div><p class="body">${esc(x.viDef)}</p></section>
 <section class="sec"><div class="sectitle"><h2>Diễn giải dễ hiểu</h2></div><p class="body">${esc(x.plainVi)}</p></section>
 <section class="sec opm"><div class="sectitle"><h2>OPM action / focus</h2></div><p class="body">${esc(x.opm||'—')}</p></section>
 <section class="sec"><div class="sectitle"><h2>Ví dụ trong công việc OPM</h2></div><p class="body">${esc(x.opmExample)}</p></section>
 ${x.owner?`<section class="sec"><div class="sectitle"><h2>Typical owner</h2></div><p class="body">${esc(x.owner)}</p></section>`:''}
 ${vs.length?`<section class="sec"><div class="sectitle"><h2>Other meanings of ${esc(x.term)}</h2></div>${vs.map(v=>`<button class="variant" data-v="${v.id}">${esc(v.full)}<small>${esc(v.sources.join(' • '))}</small></button>`).join('')}</section>`:''}
 <section class="sec"><details class="prov"><summary>Sources & provenance${x.mergedCount>1?` · ${x.mergedCount} source records consolidated`:''}</summary><div class="provbody"><p class="body">${esc(x.provenance)}</p>${ai?'<div class="callout">Vietnamese explanation is a working aid generated from the preserved source meaning. It is not a controlled Milwaukee/TTI definition. Current controlled procedures/Master Definitions take precedence.</div>':''}<div style="margin-top:10px">${x.sources.map((s,i)=>`<div class="srcrow"><b>${esc(s)}</b><span>${esc(x.refs[i]||x.refs[0]||'')}</span></div>`).join('')}</div>${x.sourceVariants.length>1?`<div style="margin-top:10px"><div class="ft">Source wording retained</div>${x.sourceVariants.map(v=>`<div class="variantline">${esc(v)}</div>`).join('')}</div>`:''}</div></details></section>
 <section class="sec"><div class="sectitle"><h2>Related terms</h2></div><div class="related">${x.related.length?x.related.map(t=>`<button data-rel="${encodeURIComponent(t)}">${esc(t)}</button>`).join(''):'<span class="body">No related terms added.</span>'}</div></section>`;
 bindActions(x);$('detail').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>selectRecord(DATA.find(z=>z.id===b.dataset.v)));$('detail').querySelectorAll('[data-rel]').forEach(b=>b.onclick=()=>{state.q=decodeURIComponent(b.dataset.rel);$('q').value=state.q;selected=0;render()});updateUrl(x)
}
function bindActions(x){$('save').onclick=()=>toggleSave(x.id);$('copy').onclick=()=>copyRecord(x);$('share').onclick=()=>shareRecord(x)}
function renderDetail(){if(!FILTERED.length)return;const x=FILTERED[selected];x.type==='Supplier'?renderSupplier(x):x.type==='Process'?renderProcess(x):renderGlossary(x)}
function activeItems(){
 const a=[];if(state.q)a.push(['q',`Search: ${state.q}`]);
 if(state.scope==='Supplier'){
  if(state.commodity!=='All')a.push(['commodity',state.commodity]);
  if(state.buyer!=='All')a.push(['buyer',state.buyer]);
  if(state.route!=='All')a.push(['route',state.route]);
  if(state.research!=='All')a.push(['research',state.research]);
  if(state.needsCheck)a.push(['needsCheck','Needs verification']);
 }else if(state.scope==='Process'){
  if(state.category!=='All')a.push(['category',state.category]);
  if(state.openOnly)a.push(['openOnly','Open checks only']);
 }else if(state.scope==='Glossary'){
  if(state.category!=='All')a.push(['category',state.category]);
  state.levels.forEach(v=>a.push(['level',v]));
  if(state.ambiguous)a.push(['ambiguous','Ambiguous only']);
 }
 if(state.savedOnly)a.push(['savedOnly','Saved only']);return a
}
function renderActive(){const a=activeItems(),b=$('active');b.classList.toggle('show',a.length>0);b.innerHTML=a.map((x,i)=>`<button class="achip" data-a="${i}">${esc(x[1])} ×</button>`).join('');b.querySelectorAll('[data-a]').forEach(z=>z.onclick=()=>{const[k,v]=a[Number(z.dataset.a)];if(k==='q'){state.q='';$('q').value=''}else if(k==='level')state.levels.delete(v);else if(['needsCheck','openOnly','ambiguous','savedOnly'].includes(k))state[k]=false;else state[k]='All';selected=0;render()})}
function renderOnly(){renderResults();renderActive();renderDetail()}
function render(){document.querySelectorAll('[data-scope]').forEach(b=>b.classList.toggle('active',b.dataset.scope===state.scope));$('q').placeholder=state.scope==='Supplier'?'Search vendor name, vendor code or commodity…':'Search term, process, role/PIC, supplier…';$('topnote').textContent=state.scope==='Supplier'?'Search by vendor name, vendor code or commodity; filter by commodity.':state.scope==='Process'?'Search working flows, rules, examples and open checkpoints.':state.scope==='Glossary'?'Every term has Vietnamese definition + practical OPM explanation.':'Search first; use tabs only when you want to narrow the result type.';renderFilters();renderResults();renderActive();if(FILTERED.length)renderDetail();updateSaved()}
function resetFilters(){state.category='All';state.levels.clear();state.commodity='All';state.buyer='All';state.route='All';state.research='All';state.needsCheck=false;state.openOnly=false;state.ambiguous=false}
function updateSaved(){$('savedBtn').classList.toggle('active',state.savedOnly);$('savedBtn').innerHTML=`${state.savedOnly?'★':'☆'} <span class="savedlabel">Saved${state.saved.size?' ('+state.saved.size+')':''}</span>`}
function toggleSave(id){state.saved.has(id)?state.saved.delete(id):state.saved.add(id);localStorage.setItem('milV15Saved',JSON.stringify([...state.saved]));render();toast(state.saved.has(id)?'Saved':'Removed')}
function recordUrl(x){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set(x.type==='Supplier'?'supplier':x.type==='Process'?'process':'term',x.term);u.searchParams.set('record',x.id);return u.toString()}
function updateUrl(x){history.replaceState(null,'',recordUrl(x))}
function shareRecord(x){const u=recordUrl(x);if(navigator.share)navigator.share({title:x.term,url:u}).catch(()=>{});else navigator.clipboard.writeText(u).then(()=>toast('Link copied'))}
function copyRecord(x){
 let t;
 if(x.type==='Supplier')t=`${x.term}
Vendor code(s): ${x.vendorCodes.join(' | ')||'—'}
Commodity: ${x.commodity||'—'}
Possible parts / public capabilities: ${x.verifiedProducts||'—'}
Address: ${x.regAddresses||'—'}
Supplier contacts: ${x.contactVendorRecords||x.emails||'—'}
Internal TTI relation: ${x.mainContacts||x.internal||'—'}
Notes / watch-outs: ${x.remarks||x.dq||'—'}`;
 else if(x.type==='Process')t=`${x.term} — ${x.full}
Purpose: ${x.purpose}
OPM focus: ${x.opm}
Flow:
- ${x.processSteps.join('\n- ')}
Working rules:
- ${x.workingRules.join('\n- ')}
Examples:
- ${x.processExample.join('\n- ')}
Open checks:
- ${x.openChecks.join('\n- ')}
Roles/current PICs:
- ${Object.entries(x.rolePics||{}).map(([r,p])=>`${r}: ${p}`).join('\n- ')}
Applicability: ${x.applicability}
Source: ${x.sources.join(' | ')}`;
 else t=`${x.term} — ${x.full}
Vietnamese: ${x.vi}
Định nghĩa: ${x.viDef}
Diễn giải: ${x.plainVi}
OPM focus: ${x.opm}
Ví dụ OPM: ${x.opmExample}
Provenance: ${x.provenance}`;
 navigator.clipboard.writeText(t).then(()=>toast('Copied'))
}
function selectRecord(x){state.scope=x.type;resetFilters();state.q=x.term;$('q').value=x.term;FILTERED=results();selected=Math.max(0,FILTERED.findIndex(y=>y.id===x.id));render()}
function clearAll(){state.q='';$('q').value='';state.savedOnly=false;resetFilters();selected=0;const u=new URL(location.href);u.search='';history.replaceState(null,'',u);render();$('q').focus()}
function exportFiltered(){if(!FILTERED.length)return;const c=['Term','Type','Meaning/Commodity','Vietnamese/Buyer','Vendor Codes','Tax/Registration IDs','Registered Addresses','Products/Capabilities','Research Status'];const lines=[c,...FILTERED.map(x=>[x.term,x.type,x.type==='Supplier'?x.commodity:x.full,x.type==='Supplier'?x.buyer:x.vi,x.vendorCodes.join(' | '),x.taxIds,x.regAddresses,x.verifiedProducts,x.researchStatus])].map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')).join('\n');const blob=new Blob(['\uFEFF'+lines],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Milwaukee_Dictionary_v14_Filtered.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1300)}
function openDrawer(){$('drawer').classList.add('show');$('backdrop').classList.add('show')}function closeDrawer(){$('drawer').classList.remove('show');$('backdrop').classList.remove('show')}
function deep(){
 const u=new URL(location.href),s=u.searchParams.get('supplier'),p=u.searchParams.get('process'),term=u.searchParams.get('term'),r=u.searchParams.get('record');
 if(s){state.scope='Supplier';state.q='';$('q').value='';FILTERED=results();const i=FILTERED.findIndex(x=>(r&&x.id===r)||norm(x.term)===norm(s));selected=i>=0?i:0;return}
 if(p){state.scope='Process';state.q=p;$('q').value=p}else if(term){state.scope='Glossary';state.q=term;$('q').value=term}else return;
 FILTERED=results();if(r){const i=FILTERED.findIndex(x=>x.id===r);selected=i>=0?i:0}
}
async function load(){try{const r=await fetch(`glossary_data.csv?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);lastModified=r.headers.get('last-modified')||'';DATA=records(await r.text());deep();render();const suppliers=DATA.filter(x=>x.type==='Supplier'),processes=DATA.filter(x=>x.type==='Process'),web=suppliers.filter(x=>webCount(x)>0).length,mod=lastModified?new Date(lastModified):null;$('foot').textContent=`${DATA.length.toLocaleString()} records • ${processes.length} process playbooks • ${suppliers.length} supplier profiles • ${web} supplier profiles with external research${mod&&!isNaN(mod)?' • Data '+mod.toLocaleDateString():''}`}catch(e){$('count').textContent='Data unavailable';$('results').innerHTML='<div class="empty"><strong>Could not load glossary_data.csv</strong>Confirm CSV is deployed beside index.html.</div>';$('detail').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
let timer;$('q').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{state.q=e.target.value;selected=0;render()},45)});$('q').addEventListener('keydown',e=>{if(e.key==='ArrowDown'&&FILTERED.length){e.preventDefault();selected=Math.min(selected+1,FILTERED.length-1);renderOnly();document.querySelector(`[data-i="${selected}"]`)?.scrollIntoView({block:'nearest'})}if(e.key==='ArrowUp'&&FILTERED.length){e.preventDefault();selected=Math.max(selected-1,0);renderOnly();document.querySelector(`[data-i="${selected}"]`)?.scrollIntoView({block:'nearest'})}});
document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{state.scope=b.dataset.scope;resetFilters();selected=0;render()});$('savedBtn').onclick=()=>{state.savedOnly=!state.savedOnly;selected=0;render()};$('clearBtn').onclick=clearAll;$('exportBtn').onclick=exportFiltered;$('filterBtn').onclick=openDrawer;$('closeDrawer').onclick=closeDrawer;$('backdrop').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus()}if(e.key==='Escape'){if($('drawer').classList.contains('show'))closeDrawer();else if(state.q){state.q='';$('q').value='';selected=0;render()}}});load();
</script></body></html>
